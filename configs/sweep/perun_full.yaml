# PERUN full sweep (perun_sweep_v2.md + D43 amendments). NOT executed locally --
# submit via: scripts/sweep_launcher.py --config configs/sweep/perun_full.yaml --mode slurm
# (emits results/sweep/perun_full/submit.sbatch; sbatch it manually after review).
#
# Grid (doc v2): ablation core B/C/D @ FULL pool x 3 seeds (9 runs) + arm D
# identity-scaling curve {300,1000,2000,3520} x 3 seeds (9 runs, full-pool point
# shared with the ablation core) = 18 embedder runs; arm A adds 1 cache pass (run
# once per seed here for schema uniformity -- negligible extra cost, ImageNet
# weights are seed-independent). Detector: yolo11s + yolo11m x 2 data mixes,
# ~100 epochs each = 4 runs (mixes = mot17dev vs mot17dev_carla, D43-delta(b):
# finetune_detector.py's --mix now really folds CARLA scenario frames into TRAIN).
name: perun_full
half: dev
gate_probe: [0.40, 0.45, 0.50]
epochs: 60
batches_per_epoch: 400
eval_every: 5  # D43-delta(a): budget-load-bearing (5x eval-cost cut, see context.md D43)
seeds: [0, 1, 2]
pools: [null]  # default: full pool for every arm except D's override below

arms:
  A:
    sources: null  # ImageNet null -- no training, cache pass only
  B:
    sources: [sim]
  C:
    sources: [mot17_dev, mot20, market1501]
  D:
    sources: [mot17_dev, sim, mot20, market1501]
    pools: [300, 1000, 2000, 3520]  # identity-scaling curve (D36 log-scale requirement)

mcnemar_pairs:
  - [D, A]
  - [D, C]
  - [C, A]

detector:
  enabled: true
  models: [yolo11s, yolo11m]
  mixes: [mot17dev, mot17dev_carla]
  base_weights: null  # null -> "<model>.pt" pretrained checkpoint
  epochs: 100
  imgsz: 960
  batch: 8

# D43-delta(d): partition/account are unfilled placeholders on purpose -- load_config
# WARNS (never fails) on them so local use is never blocked, but submission-side stays
# visibly incomplete until a human fills in the real PERUN values. time=04:00:00 derived
# from the measured ~1.2-3h/unit budget (context.md D43 extrapolation) with margin.
slurm:
  partition: "<FILL-PERUN-PARTITION>"
  account: "<FILL-PERUN-ACCOUNT>"
  time: "04:00:00"
  gres: "gpu:1"
  cpus_per_task: 8
  mem: "32G"

env:
  device: cuda
